# ============================================
# DAST JOBS
# ============================================

# DAST - DEV Environment
dast_dev:
  extends: dast
  stage: dast
  tags:
    - docker
  variables:
    DAST_WEBSITE: "$FASTAPI_DEV_URL"
  dependencies:
    - deploy_dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  allow_failure: false

# DAST - Staging Environment
dast_staging:
  extends: dast
  stage: dast
  tags:
    - docker
  variables:
    DAST_WEBSITE: "$FASTAPI_STAGING_URL"
  dependencies:
    - deploy_staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
  allow_failure: false

